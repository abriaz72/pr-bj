<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock-up - stacked layout with side bets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#ddd;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{border:1px solid #555;background:#fff;border-radius:6px;font-size:12px;padding:6px 9px}
.tabs button.on{background:#222;color:#fff}
.phone{position:relative;width:390px;height:699px;background:#fff;overflow:hidden}
.abs{position:absolute;left:10px;right:10px}
.hdr{top:8px;height:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold}
.i{width:26px;height:26px;border:1px solid #222;border-radius:50%;text-align:center;line-height:24px;font-weight:normal}
.hand{border:1px solid #ddd;border-radius:10px;height:94px;padding:7px}
.hand .lb{font-size:11px;color:#888;height:14px}
.fan{display:flex;height:62px;margin-top:4px}
.card{width:42px;height:62px;border:1px solid #888;border-radius:5px;background:#fff;font-size:15px;font-weight:bold;padding:3px;margin-right:-10px;position:relative}
.card.red{color:#b3261e}.card.back{background:repeating-linear-gradient(135deg,#eee,#eee 4px,#ddd 4px,#ddd 8px)}
.peek{position:absolute;left:60px;right:60px;top:6px;height:30px;display:none;align-items:center;justify-content:center;background:#f2f2f2;border:1px solid #222;border-radius:8px;font-size:14px;font-weight:bold;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sb{height:64px;display:flex;align-items:center;justify-content:center;gap:34px}
.circ{width:56px;height:56px;border-radius:50%;border:1.5px solid #555;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:bold;line-height:1.15}
.circ small{font-size:11px;font-weight:bold}
.circ.won{background:#e6f4e6;border-color:#1a7d1a;color:#1a7d1a}
.circ.lost{color:#b3261e;border-color:#b3261e}
.glow{box-shadow:0 0 8px 3px rgba(26,125,26,.45)}
.odds{display:flex;gap:6px;height:120px}
.ob{flex:1;border:1px solid #ddd;border-radius:10px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ob .n{font-size:13px;color:#555}.ob .v{font-size:24px;font-weight:bold;margin:4px 0}.ob .p{font-size:14px;font-weight:bold;color:#1a7d1a}
.bet{height:207px;border:1.5px dashed #bbb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999}
.cd{height:57px;border:1px solid #ddd;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold}
.cd b{font-size:20px}
.note{font-size:12px;color:#444;max-width:390px;line-height:1.4}
</style></head><body>
<div class="tabs" id="tabs"></div>
<div class="phone" id="phone">
  <div class="abs hdr"><span>Bet Blackjack</span><span class="i">i</span></div>
  <div class="abs" style="top:38px;height:192px">
    <div class="peek" id="peek"></div>
    <div class="hand" id="dealer"></div>
    <div class="hand" id="player" style="margin-top:4px"></div>
  </div>
  <div class="abs sb" id="sb" style="top:234px"></div>
  <div class="abs odds" id="odds" style="top:302px"></div>
  <div class="abs bet" id="bet" style="top:426px">bet area (207px) - unchanged</div>
  <div class="abs cd" id="cd" style="top:634px"></div>
</div>
<div class="note" id="note"></div>
<script>
const C=(r,s,red,back)=>`<div class="card ${red?'red':''} ${back?'back':''}">${back?'':r+'<br>'+s}</div>`;
const states={
 'Betting open':{d:['6♦',1],dh:1,p:[['J','♠'],['9','♦',1]],peek:'',sb:[['PP','£10',''],['21+3','',''] ],cd:['Place your bets - cards dealt in','10'],note:'Betting open. Cards start at 38px (the peek strip is gone) so the side-bet row fits: cards 38-230, circles 234-298, odds 302-422, bet area 426-633, countdown 634.'},
 'Peek message over dealer':{p:[['J','♠'],['9','♦',1]],peek:'Dealer has no blackjack',sb:[['PP','£10',''],['21+3','£5','']],cd:['Reveal dealer\'s card in','7'],note:'The peek message is overlaid across the top of the dealer box (30px high). It covers the "Dealer" label and the top 5px of the cards.'},
 'Side bets settled':{p:[['K','♥',1],['K','♦',1]],peek:'',sb:[['PP','+£250','won glow'],['21+3','-£5','lost']],cd:['Next hand in','4'],note:'Settled hand: circles show net result until the hand ends (as in the side by side layout). Winning circle highlighted.'},
 'Longer hands':{p:[['5','♣'],['4','♦',1],['3','♠'],['2','♥',1],['A','♣'],['2','♠']],dl:[['6','♦',1],['2','♣'],['5','♠'],['3','♥',1],['4','♦',1]],peek:'',sb:[['PP','£10',''],['21+3','£5','']],cd:['Place your bets - Player draws in','6'],note:'Six cards in the player row, five in the dealer row. The stacked rows are full width, so cards still fit.'}
};
function hand(id,label,cards){document.getElementById(id).innerHTML=`<div class="lb">${label}</div><div class="fan">${cards}</div>`}
function show(name){
 const s=states[name];
 const dl=s.dl||[['6','♦',1]];
 hand('dealer','Dealer',dl.map(c=>C(c[0],c[1],c[2])).join('')+(s.dl?'':C('','',0,1)));
 hand('player','Player',s.p.map(c=>C(c[0],c[1],c[2])).join(''));
 const pk=document.getElementById('peek');pk.style.display=s.peek?'flex':'none';pk.textContent=s.peek;
 document.getElementById('sb').innerHTML=s.sb.map(b=>`<div class="circ ${b[2]}${b[2].includes('won')?' glow':''}"><span>${b[0]}</span>${b[1]?`<small>${b[1]}</small>`:''}</div>`).join('');
 document.getElementById('odds').innerHTML=[['Dealer','1.97'],['Push','10.98'],['Player','2.20']].map(o=>`<div class="ob"><span class="n">${o[0]}</span><span class="v">${o[1]}</span><span class="p">£0.00</span></div>`).join('');
 document.getElementById('cd').innerHTML=`<span>${s.cd[0]}</span><b>${s.cd[1]}</b>`;
 document.getElementById('note').textContent=s.note;
 [...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('on',b.textContent===name));
}
document.getElementById('tabs').innerHTML=Object.keys(states).map(k=>`<button onclick="show('${k}')">${k}</button>`).join('');
show('Betting open');
</script></body></html>
